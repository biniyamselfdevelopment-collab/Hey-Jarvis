[package]
name = "hey-jarvis"
version = "0.0.1"
description = "A friendly helper that lives in your screen's notch and actually does things."
edition = "2021"
rust-version = "1.80"

[lib]
name = "hey_jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt"] }
tauri-plugin-global-shortcut = "2"

[target."cfg(windows)".dependencies]
win32job = "2"
# Voice runs in the Python sidecar (apps/voice). M3 screen stack: xcap (screenshots), enigo (mouse/keyboard), keyring (OS keychain)
