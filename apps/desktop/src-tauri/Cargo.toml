[package]
name = "hey-jarvis"
version = "0.0.1"
description = "A friendly helper that lives in your screen's notch and actually does things."
edition = "2021"
rust-version = "1.80"

[lib]
name = "hey_jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt"] }
# M1 voice stack (added when implemented):
#   cpal         – mic capture
#   ort          – ONNX Runtime for openWakeWord "hey_jarvis", Silero VAD, Kokoro TTS
#   whisper-rs   – whisper.cpp STT, `cuda` feature on the RTX 3070
# M3 screen stack: xcap (screenshots), enigo (mouse/keyboard), keyring (OS keychain)
